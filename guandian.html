<script>
(function(){
  "use strict";
  var ZY = window.GZ.ZHOUYI;
  var gdGrid = document.getElementById("gdGrid");
  var gdDetail = document.getElementById("gdDetail");
  var gdSearch = document.getElementById("gdSearch");
  var gdState = {q:"", tri:""};

  function guaList(){
    var arr = [];
    for (var k in ZY) if (ZY.hasOwnProperty(k)) arr.push(ZY[k]);
    arr.sort(function(a,b){ return a.kw - b.kw; });
    return arr;
  }
  function glyphOf(g){
    try { return String.fromCharCode(0x4DC0 + g.kw - 1); } catch(e){ return ""; }
  }
  function renderGrid(){
    var q = gdState.q.trim();
    var list = guaList().filter(function(g){
      if (gdState.tri && g.name.indexOf(gdState.tri) === -1 && g.short !== gdState.tri) return false;
      if (!q) return true;
      var hay = g.name + (g.guaci || "") + (g.daxiang || "");
      g.yaoci.forEach(function(y){ hay += y.tag + y.text; });
      return hay.indexOf(q) !== -1;
    });
    gdGrid.innerHTML = list.map(function(g){
      return '<button class="gd-cell" data-gua="' + esc(g.name) + '">' +
        '<span class="gd-glyph">' + glyphOf(g) + '</span>' +
        '<span class="gd-name">' + esc(g.name) + '</span>' +
        '<span class="gd-kw mono">' + ("0" + g.kw).slice(-2) + ' · ' + esc(g.short) + '</span>' +
      '</button>';
    }).join("") || '<div class="ledger-empty">未找到匹配的卦。</div>';
  }
  function renderDetail(name){
    var g = ZY[name];
    if (!g){ gdDetail.innerHTML = ""; return; }
    var rows = g.yaoci.map(function(y){
      return '<div class="gd-yao' + (y.pos >= 6 ? " yong" : "") + '"><span class="gd-tag mono">' + esc(y.tag) + '</span><p>' + esc(y.text) + '</p></div>';
    }).join("");
    gdDetail.innerHTML =
      '<div class="gd-head">' +
        '<div><div class="gd-title">' + esc(g.name) + ' <span class="gd-big-glyph">' + glyphOf(g) + '</span></div>' +
        '<div class="res-sub" style="color:var(--paper-muted)">《周易》第' + g.kw + '卦 · ' + esc(g.short) + '</div></div>' +
        '<button class="btn-paper" id="gdClose">收起</button>' +
      '</div>' +
      '<div class="gd-block"><div class="k">卦辞</div><p class="gd-text">' + esc(g.guaci) + '</p></div>' +
      '<div class="gd-block"><div class="k">彖传</div><p class="gd-text">' + esc(g.tuan) + '</p></div>' +
      '<div class="gd-block"><div class="k">大象传</div><p class="gd-text">' + esc(g.daxiang) + '</p></div>' +
      '<div class="gd-block"><div class="k">爻辞</div>' + rows + '</div>' +
      '<div class="disclaimer" style="color:var(--paper-muted)">出处：《周易》经文（卦辞、爻辞）与《易传》（彖、大象）。文本经多源校勘，异文依通行本。</div>';
    document.getElementById("gdClose").addEventListener("click", function(){ gdDetail.innerHTML = ""; });
    gdDetail.scrollIntoView({behavior: reduced() ? "auto" : "smooth", block:"start"});
  }

  gdGrid.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-gua]") : null;
    if (b) renderDetail(b.getAttribute("data-gua"));
  });
  gdSearch.addEventListener("input", function(){ gdState.q = gdSearch.value; renderGrid(); });
  document.getElementById("gdTriFilter").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-tri]") : null;
    if (!b) return;
    Array.prototype.forEach.call(this.children, function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    gdState.tri = b.getAttribute("data-tri");
    renderGrid();
  });

  renderGrid();
  var pre = new URLSearchParams(location.search).get("gua");
  if (pre && ZY[pre]) renderDetail(pre);

})();
</script>
