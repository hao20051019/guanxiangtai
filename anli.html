        <button class="chip on" data-sort="recent">最近记录</button>

        <span>记录</span><span>问题 / 所问</span><span>起卦时间</span><span>本卦 · 变卦</span><span style="text-align:right;">状态</span><span style="text-align:right;">操作</span>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
(function(){
  "use strict";
  var records = loadRecords();
  var filterType = "全部类型", sortBy = "recent", query = "";

  function recCast(r){
    if (r.method === "time" && r.upperNum){
      return castByNums(r.upperNum, r.lowerNum, r.move, r.meta || {method:"time", label:"时间起卦"});
    }
    return cast(r.n1, r.n2, r.n3);
  }

  function renderLedger(){
    var body = document.getElementById("ledgerBody");
    var list = records.filter(function(r){
      if (filterType !== "全部类型" && r.type !== filterType) return false;
      if (query){
        var c = recCast(r);
        var hay = r.id + r.q + r.type + c.benName + c.biName + r.time;
        if (hay.toLowerCase().indexOf(query.toLowerCase()) === -1) return false;
      }
      return true;
    });
    if (sortBy === "type") list = list.slice().sort(function(a,b){ return a.type.localeCompare(b.type, "zh"); });
    else if (sortBy === "time") list = list.slice().sort(function(a,b){ return a.time < b.time ? 1 : -1; });
    else list = list.slice().sort(function(a,b){ return (b.id - a.id) || 0; });

    if (!list.length){
      body.innerHTML = '<div class="ledger-empty">暂无符合条件的记录。换一个筛选条件，或先起一卦。</div>';
      return;
    }
    body.innerHTML = list.map(function(r){
      var c = recCast(r);
      return '<div class="ledger-row" data-id="' + r.id + '">' +
        '<div class="id">#' + r.id + '</div>' +
        '<div class="q">' + esc(r.q) + '<small>' + esc(r.type) + ' · ' + esc(r.method === "time" ? (r.meta && r.meta.label ? r.meta.label : "时间起卦") : ("三数 " + r.n1 + " / " + r.n2 + " / " + r.n3)) + '</small></div>' +
        '<div class="t">' + esc(r.time) + '</div>' +
        '<div class="t">' + esc(c.benName) + ' → ' + esc(c.biName) + '</div>' +
        '<button class="st linkbtn' + (r.status === "已完成" ? " done" : "") + '" data-toggle="' + r.id + '" title="点击切换状态">' + esc(r.status) + '</button>' +
        '<div class="act"><button class="linkbtn" data-open="' + r.id + '">查看' +
          '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M3 10h13M11 5l5 5-5 5"/></svg>' +
        '</button><button class="linkbtn" data-del="' + r.id + '" title="删除此记录">删除</button></div>' +
      '</div>';
    }).join("");

    Array.prototype.forEach.call(body.querySelectorAll("[data-open]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-open");
        var rec = null;
        records.forEach(function(x){ if (x.id === id) rec = x; });
        if (!rec) return;
        if (rec.method === "time" && rec.upperNum){
          saveLastCast(rec);
        } else {
          var c = cast(rec.n1, rec.n2, rec.n3);
          saveLastCast(payloadFromCast(c, rec.type, rec.q, rec.time));
        }
        location.href = "duangua.html";
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll("[data-toggle]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-toggle");
        records.forEach(function(x){
          if (x.id === id) x.status = x.status === "已完成" ? "待回看" : "已完成";
        });
        persist(records);
        renderLedger();
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll("[data-del]"), function(b){
      b.addEventListener("click", function(){
        var id = b.getAttribute("data-del");
        records = records.filter(function(x){ return x.id !== id; });
        persist(records);
        renderLedger();
        toast("记录 #" + id + " 已删除");
      });
    });
  }

  renderLedger();

  Array.prototype.forEach.call(document.querySelectorAll("[data-type]"), function(b){
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(document.querySelectorAll("[data-type]"), function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      filterType = b.getAttribute("data-type");
      renderLedger();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-sort]"), function(b){
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(document.querySelectorAll("[data-sort]"), function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      sortBy = b.getAttribute("data-sort");
      renderLedger();
    });
  });
  document.getElementById("search").addEventListener("input", function(e){
    query = e.target.value.trim();
    renderLedger();
  });
  var fToggle = document.getElementById("filterToggle");
  if (fToggle) fToggle.addEventListener("click", function(){
    var box = document.getElementById("filters");
    var open = box.classList.toggle("collapsed") === false;
    fToggle.setAttribute("aria-expanded", open ? "true" : "false");
  });

})();
</script>
</body>
</html>
