<script>
(function(){
  "use strict";

  /* ================= 课程（依典籍） ================= */
  var LESSONS = window.CURRICULUM || [];
  var rail = document.getElementById("lessonRail");
  LESSONS.forEach(function(l, i){
    var b = document.createElement("button");
    b.className = "lesson" + (i === 0 ? " on" : "");
    b.innerHTML = '<span class="t">' + esc(l.t) + '</span><span class="idx">' + ("0" + (i + 1)).slice(-2) + ' / ' + ("0" + LESSONS.length).slice(-2) + '</span>';
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(rail.children, function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      renderLesson(i);
    });
    rail.appendChild(b);
  });
  function renderLesson(i){
    var l = LESSONS[i];
    document.getElementById("lessonBody").innerHTML =
      '<p class="label" style="letter-spacing:.22em;color:var(--brass);">' + esc(l.mod) + '</p>' +
      l.body.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join("") +
      (l.quotes || []).map(function(q){
        return renderQuote(q.src, q.text, true, q.f || "");
      }).join("");
  }
  renderLesson(0);

  /* ================= 卦象层次画布（示例盘：三数 5·8·7） ================= */
  var LAYER_TEXT = {
    ben:  {title:"本卦 · 所问之事的当前局面", text:"本卦由上下两个卦象合成，代表此刻事情的整体气象。先看上下两卦的五行与生克，再看卦名所指之意。不要一上来就套吉凶词，先承认它描述的是「局面」。"},
    hu:   {title:"互卦 · 事情展开的中间过程", text:"互卦藏于本卦之内，取二三四爻与三四五爻合成，代表事情经过的阶段与节奏。判断进展快慢、中途有无反复，多看这一层。"},
    bian: {title:"变卦 · 演变之后的趋势", text:"动爻阴阳互换而成变卦，代表事情往后的走向。变卦给的是趋势与气象，不是承诺；它与本卦的差别，正是你该留意的变化。"},
    move: {title:"动爻 · 全局的枢纽", text:"一位动爻，是整盘的枢纽。它所在的位置说明事情的着力点在何处，它所属的卦决定了体用之分。读盘时，先找动爻，再谈其他。"}
  };
  var current = cast(5, 8, 7);
  var currentLayer = "ben";

  function miniGroup(title, lines, movingIdx, hl, mv){
    var rows = "";
    for (var i = lines.length - 1; i >= 0; i--){
      var v = lines[i];
      var cls = "r" + (mv && i === movingIdx - 1 ? " mv" : "");
      rows += '<div class="' + cls + '">' + (v === 1 ? '<i class="y"></i>' : '<i class="m"></i><i class="m"></i>') + '</div>';
    }
    return '<div class="grp' + (hl ? " hl" : "") + '"><div class="cap">' + title + '</div>' + rows + '</div>';
  }
  function renderMiniHex(){
    document.getElementById("miniHex").innerHTML =
      miniGroup("本卦 " + current.benName, current.lines, current.move, currentLayer === "ben", false) +
      miniGroup("互卦 " + current.huName, current.huLower.lines.concat(current.huUpper.lines), 0, currentLayer === "hu", false) +
      miniGroup("变卦 " + current.biName, current.biLines, 0, currentLayer === "bian", false) +
      miniGroup("动爻 " + current.pos.k, current.lines, current.move, currentLayer === "move", true);
  }
  function renderLayerData(){
    var info = LAYER_TEXT[currentLayer];
    document.getElementById("layerTitle").textContent = info.title;
    document.getElementById("layerText").textContent = info.text;
    var d = "";
    if (currentLayer === "ben"){
      d = '<div>上卦 <b>' + current.upper.name + '</b> ' + current.upper.sym + ' · ' + current.upper.nature + ' · ' + current.upper.elem + '</div>' +
          '<div>下卦 <b>' + current.lower.name + '</b> ' + current.lower.sym + ' · ' + current.lower.nature + ' · ' + current.lower.elem + '</div>' +
          '<div>卦名 <b>' + current.benName + '</b> ' + current.benGlyph + '</div>';
    } else if (currentLayer === "hu"){
      d = '<div>上互 <b>' + current.huUpper.name + '</b> · 下互 <b>' + current.huLower.name + '</b></div>' +
          '<div>卦名 <b>' + current.huName + '</b> ' + current.huGlyph + '</div>' +
          '<div>取爻 <b>二三四 / 三四五</b></div>';
    } else if (currentLayer === "bian"){
      d = '<div>变卦 <b>' + current.biName + '</b> ' + current.biGlyph + '</div>' +
          '<div>上卦 <b>' + current.biUpper.name + '</b> · 下卦 <b>' + current.biLower.name + '</b></div>' +
          '<div>变动 <b>第' + current.move + '爻</b> 阴阳互换</div>';
    } else {
      d = '<div>动爻 <b>' + current.pos.k + '</b>（第' + current.move + '爻）</div>' +
          '<div>用卦 <b>' + current.yong.name + '（' + current.yong.elem + '）</b> · 体卦 <b>' + current.ti.name + '（' + current.ti.elem + '）</b></div>' +
          '<div>体用 <b>' + current.rel + '</b></div>';
    }
    document.getElementById("layerData").innerHTML = d;
  }
  Array.prototype.forEach.call(document.querySelectorAll("#layerTabs button"), function(b){
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(document.querySelectorAll("#layerTabs button"), function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      currentLayer = b.getAttribute("data-layer");
      renderMiniHex();
      renderLayerData();
    });
  });
  renderMiniHex();
  renderLayerData();

})();
</script>
</body>
